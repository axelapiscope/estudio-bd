<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>ApiscoTech Bases de Datos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Estudio interactivo del primer parcial de Sistemas de Bases de Datos (UCAB): temas, tarjetas, quizzes con diagramas, laboratorios, ejercicios y simulacro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ApiscoTech · Estudio. Concepto: hoja de estudio limpia en blanco y tinta azul-negra, con la geometría
   facetada del logo (perro low-poly) en una banda diagonal azul marino; azul ApiscoTech como único acento,
   pastillas redondeadas para datos y estados. Modo claro por defecto, oscuro azul-noche. */
:root {
  --paper: oklch(0.985 0.004 255);
  --paper-2: oklch(0.957 0.009 255);
  --card: oklch(1 0 0);
  --ink: oklch(0.21 0.035 262);
  --ink-2: oklch(0.43 0.03 262);
  --faint: oklch(0.58 0.025 262);
  --line: oklch(0.89 0.012 260);
  --line-2: oklch(0.8 0.02 260);
  --blue: oklch(0.5 0.2 263);
  --blue-2: oklch(0.42 0.19 264);
  --on-blue: oklch(0.99 0 0);
  --blue-soft: oklch(0.94 0.035 262);
  --band: oklch(0.23 0.06 264);
  --band-2: oklch(0.29 0.075 263);
  --band-3: oklch(0.35 0.09 262);
  --band-ink: oklch(0.97 0.008 255);
  --band-mute: oklch(0.8 0.04 258);
  --card-num: oklch(0.6 0.16 55);
  --ok: oklch(0.55 0.15 150);
  --ok-bg: oklch(0.95 0.045 150);
  --bad: oklch(0.55 0.2 22);
  --bad-bg: oklch(0.95 0.035 22);
  --warn-bg: oklch(0.96 0.045 85);
  --warn-line: oklch(0.82 0.11 85);
  --warn-ink: oklch(0.38 0.08 70);
  --head-bg: oklch(0.985 0.004 255 / .9);
  --shadow: 0 1px 2px oklch(0.2 0.03 262 / .06), 0 8px 24px -12px oklch(0.2 0.03 262 / .18);
  --r: 14px;
  --r-s: 10px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gx: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --f-display: "Archivo", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: oklch(0.165 0.03 264); --paper-2: oklch(0.2 0.035 264); --card: oklch(0.215 0.036 264);
    --ink: oklch(0.95 0.01 258); --ink-2: oklch(0.78 0.025 258); --faint: oklch(0.62 0.03 260);
    --line: oklch(0.31 0.04 263); --line-2: oklch(0.4 0.045 263);
    --blue: oklch(0.72 0.15 256); --blue-2: oklch(0.8 0.12 254); --on-blue: oklch(0.17 0.04 264); --blue-soft: oklch(0.28 0.07 262);
    --band: oklch(0.12 0.035 265); --band-2: oklch(0.17 0.05 264); --band-3: oklch(0.23 0.07 263); --band-ink: oklch(0.97 0.008 255); --band-mute: oklch(0.78 0.04 258);
    --card-num: oklch(0.8 0.14 70);
    --ok: oklch(0.8 0.15 150); --ok-bg: oklch(0.3 0.07 150); --bad: oklch(0.75 0.17 22); --bad-bg: oklch(0.3 0.08 22);
    --warn-bg: oklch(0.29 0.06 80); --warn-line: oklch(0.5 0.09 80); --warn-ink: oklch(0.92 0.06 85);
    --head-bg: oklch(0.165 0.03 264 / .9); --shadow: 0 1px 2px oklch(0 0 0 / .3), 0 10px 26px -14px oklch(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: oklch(0.165 0.03 264); --paper-2: oklch(0.2 0.035 264); --card: oklch(0.215 0.036 264);
  --ink: oklch(0.95 0.01 258); --ink-2: oklch(0.78 0.025 258); --faint: oklch(0.62 0.03 260);
  --line: oklch(0.31 0.04 263); --line-2: oklch(0.4 0.045 263);
  --blue: oklch(0.72 0.15 256); --blue-2: oklch(0.8 0.12 254); --on-blue: oklch(0.17 0.04 264); --blue-soft: oklch(0.28 0.07 262);
  --band: oklch(0.12 0.035 265); --band-2: oklch(0.17 0.05 264); --band-3: oklch(0.23 0.07 263); --band-ink: oklch(0.97 0.008 255); --band-mute: oklch(0.78 0.04 258);
  --card-num: oklch(0.8 0.14 70);
  --ok: oklch(0.8 0.15 150); --ok-bg: oklch(0.3 0.07 150); --bad: oklch(0.75 0.17 22); --bad-bg: oklch(0.3 0.08 22);
  --warn-bg: oklch(0.29 0.06 80); --warn-line: oklch(0.5 0.09 80); --warn-ink: oklch(0.92 0.06 85);
  --head-bg: oklch(0.165 0.03 264 / .9); --shadow: 0 1px 2px oklch(0 0 0 / .3), 0 10px 26px -14px oklch(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--paper); }
body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 400 1.03rem/1.62 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--paper); }
[hidden] { display: none !important; }
::selection { background: var(--blue); color: var(--on-blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
a { color: var(--blue); text-underline-offset: 3px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
code { background: var(--paper-2); border: 1px solid var(--line); padding: .06em .4em; border-radius: 6px; color: var(--ink); overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 4.6vw, 3.4rem); font-weight: 800; font-stretch: 118%; }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.85rem); }
h3 { font-size: 1.14rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.faint { color: var(--faint); }
.nav .sm, .brand .sm { display: none; }

/* ---------- Header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding-block: .6rem; padding-left: var(--gx); padding-right: var(--gr); }
.brand { display: flex; align-items: center; gap: .7rem; text-decoration: none; color: var(--ink); min-width: 0; flex: none; }
.logo { width: 42px; height: 42px; border-radius: 50%; background: oklch(1 0 0); border: 2px solid var(--ink); object-fit: cover; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
.brand-text b { font: 800 1.02rem var(--f-display); font-stretch: 120%; letter-spacing: .01em; }
.brand-text small { font: 500 .74rem var(--f-mono); color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; margin-top: .2rem; }
.nav { display: flex; gap: .15rem; margin: 0 auto; }
.nav a { display: flex; align-items: center; gap: .45rem; padding: .5rem .7rem; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: .93rem; transition: background .2s var(--ease), color .2s var(--ease); white-space: nowrap; }
.nav a:hover { background: var(--paper-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.top-right { display: flex; align-items: center; gap: .45rem; flex: none; }
.clock, .xp { font: 500 .8rem var(--f-mono); font-variant-numeric: tabular-nums; padding: .36rem .7rem; border: 1px solid var(--line-2); border-radius: 999px; background: var(--card); white-space: nowrap; }
.clock b, .xp b { color: var(--blue); font-weight: 600; }

/* ---------- Main ---------- */
main { max-width: 1180px; margin: 0 auto; padding-block: clamp(1.4rem, 3.4vw, 2.4rem) 5rem; padding-left: var(--gx); padding-right: var(--gr); outline: none; min-width: 0; }
main.wide { padding-top: 0; }
.view-in { animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: .35; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page-head { max-width: 760px; }
.lead { color: var(--ink-2); max-width: 66ch; margin-top: .7rem; font-size: 1.06rem; }
.eyebrow { font: 600 .74rem var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--blue); margin-bottom: .55rem; }
.sub { color: var(--ink-2); margin-top: .35rem; }

/* ---------- Botones y campos ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .62rem 1.15rem; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-weight: 600; font-size: .95rem; transition: transform .15s var(--ease), background .2s, border-color .2s; min-height: 44px; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--blue); color: var(--on-blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-2); border-color: var(--blue-2); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.mini { padding: .38rem .85rem; min-height: 36px; font-size: .86rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
.sp { flex: 1; }
select, input[type="search"] { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: .6rem .85rem; min-height: 44px; max-width: 100%; }
label.field { display: grid; gap: .35rem; color: var(--ink-2); font-size: .9rem; font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .7rem; border-radius: 999px; background: var(--blue-soft); color: var(--blue-2); font: 600 .78rem var(--f-mono); }
.pill.p-ok { background: var(--ok-bg); color: var(--ok); }
.pill.p-rep { background: var(--bad-bg); color: var(--bad); }

/* ---------- Inicio: banda diagonal ---------- */
.band { position: relative; background: var(--band); color: var(--band-ink); clip-path: polygon(0 0, 100% 0, 100% 84%, 0 100%); overflow: hidden; }
.band svg.facets { position: absolute; inset: 0; width: 100%; height: 100%; }
.facets .f1 { fill: var(--band-2); } .facets .f2 { fill: var(--band-3); } .facets .f3 { fill: var(--band); }
.band-in { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2rem; align-items: center; padding-block: clamp(2rem, 6vw, 3.6rem) clamp(4rem, 9vw, 6rem); padding-left: var(--gx); padding-right: var(--gr); max-width: 1180px; margin: 0 auto; }
.band .eyebrow { color: var(--band-mute); }
.band h1 em { font-style: normal; color: oklch(0.8 0.12 250); }
.band .lead { color: var(--band-mute); }
.band-logo { width: clamp(120px, 16vw, 190px); height: clamp(120px, 16vw, 190px); border-radius: 50%; background: oklch(1 0 0); border: 4px solid var(--band-ink); object-fit: cover; box-shadow: 0 18px 40px -16px oklch(0 0 0 / .6); }
.when { display: flex; gap: .8rem; align-items: center; margin-top: 1.4rem; flex-wrap: wrap; }
.bigtime { font: 600 clamp(2rem, 6vw, 3.4rem)/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.bigtime i { font: 500 .34em var(--f-body); color: var(--band-mute); font-style: normal; margin: 0 .5em 0 .1em; }
.band .pill { background: oklch(1 0 0 / .12); color: var(--band-ink); }
.codd { margin-top: 1.1rem; font: 400 .8rem var(--f-mono); color: var(--band-mute); max-width: 60ch; }
.next-box { margin-top: -1.6rem; position: relative; padding: 1rem 1.2rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
.next-box p { flex: 1 1 240px; color: var(--ink-2); }
.next-box p b { color: var(--ink); }

.sec { margin-top: 2.6rem; }
.sec-head { display: flex; gap: 1rem; align-items: baseline; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1rem; }
.part-list { list-style: none; counter-reset: p; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .7rem; }
.part-list li { counter-increment: p; display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; padding: .95rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.part-list li::before { content: counter(p); grid-row: span 3; font: 700 1.5rem/1 var(--f-display); font-stretch: 120%; color: var(--blue); width: 1.7rem; }
.part-list b { font-weight: 600; }
.part-list small { color: var(--faint); font-size: .84rem; }
.part-list .btn { justify-self: start; margin-top: .45rem; }

.unit { margin-top: 1.4rem; }
.unit-h { display: flex; align-items: center; gap: .7rem; margin-bottom: .6rem; }
.unit-h .tag { font: 700 .74rem var(--f-mono); letter-spacing: .08em; color: var(--on-blue); background: var(--ink); padding: .25rem .6rem; border-radius: 6px; }
.unit-h span:last-child { color: var(--ink-2); font-weight: 500; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: .8rem; }
.mcard { display: grid; gap: .55rem; padding: 1.05rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); align-content: start; }
.mcard h3 { display: flex; gap: .55rem; align-items: baseline; }
.mcard .num { font: 600 .8rem var(--f-mono); color: var(--blue); }
.mcard .bl { color: var(--ink-2); font-size: .92rem; }
.meter { height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 999px; transition: width .9s var(--ease); }
.mpct { font: 500 .78rem var(--f-mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.mcard .go { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .2rem; }
.plan { display: grid; gap: .5rem; }
.plan-row { display: grid; grid-template-columns: 6.5rem 1fr; gap: 1rem; padding: .75rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-s); align-items: baseline; }
.plan-row b { font: 600 .86rem var(--f-mono); color: var(--blue); }
.plan-row span { color: var(--ink-2); }
.import { margin-top: 2rem; padding: 1rem 1.2rem; border: 1px dashed var(--line-2); border-radius: var(--r); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }

/* ---------- Estudiar ---------- */
.study { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 2rem; margin-top: 1.4rem; align-items: start; }
.mcol { min-width: 0; }
.mods { display: grid; gap: .2rem; position: sticky; top: calc(5rem + env(safe-area-inset-top, 0px)); }
.mods .ulab { font: 700 .7rem var(--f-mono); letter-spacing: .08em; color: var(--faint); margin: .7rem .8rem .2rem; }
.mods button { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: .55rem .8rem; color: var(--ink-2); display: grid; gap: .25rem; font-size: .93rem; }
.mods button:hover { background: var(--paper-2); color: var(--ink); }
.mods button[aria-pressed="true"] { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: var(--shadow); }
.mods button small { color: var(--faint); font: 500 .74rem var(--f-mono); }
.mod-head p { color: var(--ink-2); max-width: 66ch; margin-top: .4rem; }
.mod-head .src { display: block; margin-top: .5rem; color: var(--faint); font: 500 .78rem var(--f-mono); }
.concept { padding: 1.3rem 0 1.4rem; border-bottom: 1px solid var(--line); }
.concept h3 { display: flex; gap: .75rem; align-items: flex-start; justify-content: space-between; }
.concept .body, .ej .body { margin-top: .6rem; max-width: 72ch; }
.concept .body b, .concept li b { color: var(--blue-2); font-weight: 600; }
.concept ul { margin: .6rem 0 0; padding-left: 1.2rem; max-width: 72ch; }
.concept li { margin: .35rem 0; }
.concept li::marker { color: var(--faint); }
.callout { margin-top: .9rem; padding: .75rem 1rem; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: var(--r-s); max-width: 72ch; color: var(--warn-ink); }
.chk { flex: none; display: inline-flex; align-items: center; gap: .4rem; font: 500 .82rem var(--f-body); color: var(--ink-2); padding: .3rem .7rem; border: 1px solid var(--line-2); border-radius: 999px; background: var(--card); white-space: nowrap; }
.chk svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
.chk[aria-pressed="true"] { color: var(--on-blue); background: var(--blue); border-color: var(--blue); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.toolbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
.toolbar input { flex: 1 1 220px; }

/* ---------- Figuras ---------- */
.fig { margin: .3rem 0 1.1rem; padding: 1rem; background: var(--paper-2); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; display: flex; justify-content: center; }
.fig.fig-t { display: block; }
.fig-svg { width: 100%; height: auto; display: block; }
.f-ent { fill: var(--card); stroke: var(--ink); stroke-width: 1.6; }
.f-ent.in { fill: none; }
.f-ent.ext { stroke-dasharray: 5 4; }
.f-rel { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.6; }
.f-rel.in { fill: none; }
.f-ln { stroke: var(--ink-2); stroke-width: 1.4; }
.f-sub { fill: none; stroke: var(--ink-2); stroke-width: 1.6; }
.f-circ { fill: var(--card); stroke: var(--blue); stroke-width: 1.6; }
.f-et { fill: var(--ink); font: 700 13.5px var(--f-display); text-anchor: middle; dominant-baseline: central; }
.f-rt { fill: var(--blue-2); font: italic 500 13px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.f-ct { fill: var(--blue); font: 700 15px var(--f-mono); text-anchor: middle; dominant-baseline: central; }
.f-card { fill: var(--card-num); font: 600 13px var(--f-mono); }
.tbls { display: flex; flex-wrap: wrap; gap: 1rem; }
.mini-t { flex: 1 1 240px; min-width: 0; }
.mini-t table { min-width: 0; font-size: .88rem; }
.mini-t caption { text-align: left; font: 600 .84rem var(--f-mono); color: var(--blue); padding: .5rem .8rem; caption-side: top; }
.mini-t td, .mini-t th { padding: .42rem .7rem; font-family: var(--f-mono); font-size: .82rem; }
td.nul { color: var(--faint); font-style: italic; }
.ddl { margin: 0 0 1rem; padding: .9rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-s); font: 400 .82rem/1.55 var(--f-mono); color: var(--ink); overflow-x: auto; white-space: pre; }
.ddl-box summary { cursor: pointer; color: var(--ink-2); font-weight: 600; margin-bottom: .6rem; }

/* ---------- Tarjetas ---------- */
.deck-stage { margin: 1.6rem auto 1rem; max-width: 640px; perspective: 1400px; }
.flip { position: relative; min-height: 320px; width: 100%; background: none; border: 0; padding: 0; text-align: left; display: block; }
.flip-in { position: relative; min-height: 320px; transform-style: preserve-3d; transition: transform .6s var(--ease); }
.flip[aria-pressed="true"] .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; padding: clamp(1.4rem, 4vw, 2.2rem); border-radius: 20px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: center; gap: .9rem; }
.face .tag { font: 600 .76rem var(--f-mono); color: var(--blue); letter-spacing: .04em; text-transform: uppercase; }
.face .big { font: 700 clamp(1.25rem, 3.4vw, 1.7rem)/1.25 var(--f-display); font-stretch: 110%; text-wrap: balance; }
.face.back { transform: rotateY(180deg); background: var(--band); color: var(--band-ink); border-color: var(--band); }
.face.back .tag { color: var(--band-mute); }

.deck-bar { max-width: 640px; margin: 0 auto; display: grid; gap: .6rem; }
.deck-bar .row { justify-content: center; }
.deck-count { text-align: center; font: 600 .88rem var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
kbd { font: 500 .76rem var(--f-mono); padding: .1rem .4rem; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; background: var(--card); color: var(--ink-2); }

/* ---------- Quiz ---------- */
.q-card { margin-top: 1.4rem; padding: clamp(1.1rem, 3vw, 1.7rem); border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.q-meta { display: flex; justify-content: space-between; gap: 1rem; color: var(--faint); font: 500 .84rem var(--f-mono); font-variant-numeric: tabular-nums; flex-wrap: wrap; }

.opt > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.opt:hover { border-color: var(--blue); }
.opt .l { font: 600 .82rem var(--f-mono); color: var(--blue); background: var(--blue-soft); border-radius: 999px; width: 1.6rem; height: 1.6rem; display: grid; place-items: center; }
.opt.picked { border-color: var(--blue); background: var(--blue-soft); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); animation: nudge .4s var(--ease); }

@keyframes nudge { 20% { transform: translateX(-5px); } 60% { transform: translateX(4px); } }
.why { margin-top: 1rem; padding: .85rem 1rem; border-radius: var(--r-s); background: var(--paper-2); color: var(--ink-2); }
.why b { color: var(--ink); }
.score-big { font: 800 clamp(3rem, 10vw, 5.2rem)/1 var(--f-display); font-stretch: 120%; color: var(--blue); font-variant-numeric: tabular-nums; }
.score-big small { font-size: .3em; color: var(--ink-2); font-weight: 500; font-stretch: 100%; }
.miss { margin-top: 1.6rem; display: grid; gap: .8rem; }
.miss-item { padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-s); min-width: 0; }
.miss-item p { margin-top: .35rem; color: var(--ink-2); }
.miss-item .ok { color: var(--ok); }
.miss-item .no { color: var(--bad); }
.miss-item .fig { margin-top: .8rem; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-top: 1.4rem; align-items: end; }
.streak { color: var(--card-num); font-weight: 600; }
.timer-bar { height: 5px; background: var(--paper-2); border-radius: 999px; overflow: hidden; margin-top: .7rem; }
.timer-bar i { display: block; height: 100%; background: var(--blue); transition: width 1s linear; }

/* ---------- Laboratorio ---------- */
.tabs { display: flex; gap: .35rem; flex-wrap: wrap; margin-top: 1.4rem; padding: .3rem; background: var(--paper-2); border-radius: 999px; width: fit-content; max-width: 100%; }
.tab { padding: .5rem .95rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); font-weight: 500; min-height: 40px; font-size: .92rem; }

.lab-body { margin-top: 1.6rem; }
.term { background: var(--band); border-radius: var(--r); padding: 1rem 1.2rem; font: 400 .98rem/1.6 var(--f-mono); overflow-x: auto; color: var(--band-ink); margin-top: .8rem; }

@keyframes blink { 50% { opacity: 0; } }
.chips { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .5rem; }
.chip { font: 500 .88rem var(--f-body); padding: .45rem .85rem; background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; min-height: 40px; text-align: left; transition: background .15s, border-color .15s; }
.chip.mono { font-family: var(--f-mono); font-size: .86rem; border-radius: 10px; }
.chip:hover { border-color: var(--blue); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mission-q { padding: .95rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.verdict { margin-top: .9rem; padding: .75rem 1rem; border-radius: var(--r-s); font-weight: 500; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.verdict.good { background: var(--ok-bg); }
.verdict.bad { background: var(--bad-bg); }
.seq-ans { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: .4rem; counter-reset: s; }
.seq-ans li { counter-increment: s; display: flex; align-items: center; gap: .8rem; min-height: 44px; padding: .4rem .9rem; border-radius: 11px; border: 1px dashed var(--line-2); color: var(--faint); background: var(--paper); font-family: var(--f-mono); font-size: .9rem; overflow-wrap: anywhere; }
.seq-ans li::before { content: counter(s); font: 600 .8rem var(--f-mono); color: var(--faint); width: 1.3rem; flex: none; }
.seq-ans li.filled { border-style: solid; color: var(--ink); background: var(--card); cursor: pointer; }
.seq-ans li.ok { border-color: var(--ok); background: var(--ok-bg); }
.seq-ans li.ko { border-color: var(--bad); background: var(--bad-bg); }
.seq-pool { margin-top: 1rem; }
.cl-item { font: 700 clamp(1.1rem, 3vw, 1.45rem)/1.35 var(--f-display); font-stretch: 106%; padding: 1.3rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); text-wrap: balance; box-shadow: var(--shadow); }

.pairs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.pairs-col { display: grid; gap: .5rem; align-content: start; }
.pair-btn { text-align: left; padding: .65rem .9rem; min-height: 48px; background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; transition: all .2s var(--ease); overflow-wrap: anywhere; }
.pair-btn:hover { border-color: var(--blue); }
.pair-btn.sel { border-color: var(--blue); background: var(--blue-soft); }
.pair-btn.done { border-color: var(--ok); background: var(--ok-bg); pointer-events: none; }
.pair-btn.bad { border-color: var(--bad); animation: nudge .4s var(--ease); }
.ops { display: grid; gap: .6rem; margin-top: .4rem; }
.op { padding: .85rem 1rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-s); display: grid; gap: .55rem; min-width: 0; }
.op.good { border-color: var(--ok); }
.op.bad { border-color: var(--bad); }

.op select { width: 100%; }
.op-res { color: var(--ink-2); }

/* ---------- Ejercicios ---------- */

.sol-in { margin-top: .8rem; max-width: 80ch; overflow-x: auto; }

<script>
/* Contenido de estudio. Fuentes: láminas de la Prof. Goncalves (Introducción, Criterios, Notación),
   "Un Lenguaje Lógico para Restricciones Explícitas", Práctica ER, enunciado del proyecto y
   Elmasri & Navathe (cap. 3, 4, 5 y 9) para modelo relacional y traducción.
   Las preguntas guardan SIEMPRE la respuesta correcta en la posición 0; la app mezcla al mostrar.
   Formato de pregunta: [enunciado, [opciones], explicación, figura opcional]. */

window.EXAM_DATE = new Date("2026-10-26T13:00:00-04:00");

window.MODULES = [
  /* ============================================================ 1 */
  {
    id: "fund", name: "Fundamentos de BD", src: "Unidad I · Introducción (láminas 20-35)", hue: 205,
    blurb: "Datos, esquema vs. diagrama, BD / SGBD / SBD, modelo de datos, archivos vs. BD, usuarios, lenguajes, ventajas, ANSI-SPARC y metodología.",
    concepts: [
      { t: "Datos", p: "Los <b>datos</b> son un conjunto de hechos conocidos con significado explícito para quien los usa y que reflejan el <b>estado actual de la realidad</b>.", list: ["Propiedades que se le piden a los datos en una BD: <b>persistencia</b>, <b>disponibilidad</b>, <b>consistencia</b> (cumplen las reglas del mini-mundo), <b>seguridad</b> y <b>confiabilidad</b>."] },
      { t: "Esquema, diagrama, BD, SGBD y SBD", p: "Cinco términos que la profesora separa con cuidado:", list: ["<b>Esquema de datos</b>: especificación de las propiedades que satisfacen los elementos de un mini-mundo (universo de discurso).", "<b>Esquema</b>: representación de un problema usando un <b>modelo de datos</b>. <b>Diagrama</b>: representación <b>gráfica</b> de un esquema.", "<b>Base de datos</b>: conjunto de datos relacionados entre sí que representan los elementos protagonistas de un mini-mundo.", "<b>Gestor (SGBD)</b>: software que permite crear, mantener y operar sobre BBDD.", "<b>Sistema de BD (SBD)</b>: el conjunto de aplicaciones + SGBD + datos + metadatos."], tip: "Esquema ≠ diagrama. El diagrama es solo el dibujo; el esquema es la representación (con sus restricciones)." },
      { t: "Modelo de datos", p: "Herramienta conceptual para describir las características, propiedades y estructura de los entes de un mini-mundo. Tiene tres componentes: <b>estructuras</b>, <b>restricciones</b> y <b>operaciones</b>.", list: ["Restricciones <b>inherentes</b>: las impone el propio modelo (en el relacional no hay atributos multivaluados).", "Restricciones <b>implícitas</b>: se expresan con las estructuras del esquema (claves, (min,max), participación total, entidades débiles).", "Restricciones <b>explícitas</b>: no caben en el diagrama y se escriben aparte, en lenguaje natural y LPO."] },
      { t: "Clasificaciones de modelos", p: "Tres formas de clasificar un modelo de datos:", list: ["Por nivel: <b>alto nivel / conceptual / semántico</b> (ER), <b>implementación / lógico / tradicional</b> (relacional) y <b>bajo nivel / físico</b>.", "Por identificación: <b>por valores</b> (relacional: una tupla se identifica por el valor de su clave) o <b>por existencia</b> (objetos con OID).", "Por estructura: <b>estructurados</b>, <b>semi-estructurados</b> (JSON, XML) y <b>no estructurados</b>."] },
      { t: "Procesamiento de archivos vs. bases de datos", p: "En el procesamiento de datos la unidad de trabajo es el <b>archivo</b> y el acceso lo da un lenguaje de propósito específico con primitivas de E/S del SO. En una BD la unidad de trabajo es la <b>BD</b> y el acceso lo provee el <b>SGBD</b>.", list: ["Sistema de procesamiento de datos = el software que manipula los archivos.", "SBD = aplicaciones + SGBD + datos + metadatos."] },
      { t: "Usuarios y lenguajes", p: "Actores alrededor de una BD y los lenguajes que ofrece un SGBD.", list: ["<b>DBA</b> (administra recursos, seguridad, rendimiento), <b>diseñadores</b> de BD, <b>analistas y programadores</b> de aplicaciones, <b>usuarios finales</b> (casuales, paramétricos o rutinarios, sofisticados).", "<b>DDL</b>: define la estructura (CREATE, ALTER, DROP). <b>DML</b>: manipula los datos (SELECT, INSERT, UPDATE, DELETE). <b>DCL</b>: controla seguridad y permisos (GRANT, REVOKE)."] },
      { t: "Ventajas de un SBD", p: "Lista de la lámina 29:", list: ["<b>Control de redundancia</b> (la lámina dice «Redundancia», pero se refiere a controlarla).", "Completitud de información, <b>independencia programas/datos</b>, abstracción de datos, soporte de visiones (vistas).", "Facilidad de desarrollo y mantenimiento, acceso eficiente, ejecución eficiente de consultas.", "<b>Consistencia</b>, <b>concurrencia</b> y <b>recuperación ante fallas</b>."] },
      { t: "Cuándo NO usar un SGBD", p: "Costos: alta inversión inicial (hardware, software, entrenamiento), costo de la generalidad del sistema y sobrecarga por seguridad, concurrencia, recuperación e integridad.", list: ["Conviene una solución a la medida si la aplicación es <b>simple, bien definida y sin cambios</b>, hay <b>tiempo real estricto</b>, es un <b>sistema embebido</b> con poco almacenamiento o <b>no hay acceso multiusuario</b>.", "Ejemplos con gestores propietarios: <b>CAD</b>, conmutación y <b>telecomunicaciones</b>, <b>GIS</b>."] },
      { t: "Arquitectura ANSI-SPARC (3 niveles)", p: "Separa la visión de los usuarios del almacenamiento físico.", list: ["Nivel <b>externo</b>: las vistas de cada grupo de usuarios.", "Nivel <b>conceptual</b>: la estructura de toda la BD (entidades, tipos, relaciones, restricciones).", "Nivel <b>interno</b>: cómo se almacena físicamente.", "Mapeo externo↔conceptual da <b>independencia lógica</b>; mapeo conceptual↔interno da <b>independencia física</b>."], tip: "La independencia lógica es más difícil de lograr que la física." },

      var q = qs[i], L = "ABCD";
      el.innerHTML = '<div class="q-card"><div class="q-meta"><span>' + (i + 1) + " / " + qs.length + " · " + esc(q.mod) + "</span><span>" +
        (o.seconds ? 'Tiempo <b id="tm"></b>' : '<span class="streak">Racha ' + streak + "</span>") + "</span></div>" +
        (o.seconds ? '<div class="timer-bar"><i id="tb"></i></div>' : "") +
        '<div class="q-text">' + esc(q.q) + "</div>" + fig(q.fig) + '<div class="opts">' + q.order.map(function (oi, k) {
          return '<button class="opt" data-k="' + oi + '"><span class="l">' + L[k] + "</span><span>" + esc(q.opts[oi]) + "</span></button>";
        }).join("") + '</div><div id="fb"></div><div class="row" style="margin-top:1rem"><span class="sp"></span><button class="btn" id="nx" hidden></button></div></div>';
      if (o.seconds) paintTimer();
      if (answers[i] != null) $$(".opt").forEach(function (b) { b.classList.toggle("picked", +b.dataset.k === answers[i]); });
      $$(".opt").forEach(function (b) { b.onclick = function () { choose(+b.dataset.k); }; });
      var nx = $("#nx");
      if (!o.feedback) {
        nx.hidden = false; nx.textContent = i === qs.length - 1 ? "Terminar" : "Siguiente"; nx.onclick = next;
        if (i > 0) { var pv = document.createElement("button"); pv.className = "btn ghost"; pv.textContent = "Anterior"; pv.onclick = function () { i--; show(); }; nx.parentNode.insertBefore(pv, nx); }
      }
    }
    function choose(k) {
      var q = qs[i];
      if (o.feedback) {
        if (answers[i] != null) return;
        answers[i] = k;
        $$(".opt").forEach(function (b) { var v = +b.dataset.k; b.disabled = true; if (v === 0) b.classList.add("right"); else if (v === k) b.classList.add("wrong"); });
        var ok = k === 0;
        if (ok) { score++; streak++; S.xp += 10; delete S.wrong[q.id]; } else { streak = 0; S.wrong[q.id] = 1; }
        save();
        $("#fb").innerHTML = '<div class="why"><b>' + (ok ? "¡Correcto! " : "Ojo: ") + "</b>" + esc(q.why) + "</div>";
        var nx = $("#nx"); nx.hidden = false; nx.className = "btn primary"; nx.textContent = i === qs.length - 1 ? "Ver resultado" : "Siguiente"; nx.onclick = next; nx.focus();
      } else { answers[i] = k; $$(".opt").forEach(function (b) { b.classList.toggle("picked", +b.dataset.k === k); }); }
    }
    function next() { if (i === qs.length - 1) finish(); else { i++; show(); window.scrollTo(0, el.offsetTop - 80); } }
    function finish() {
      stop(); cleanup = null;
      if (!o.feedback) { score = 0; qs.forEach(function (q, n) { var ok = answers[n] === 0; if (ok) { score++; delete S.wrong[q.id]; } else S.wrong[q.id] = 1; }); S.xp += score * 5; }
      var pct = Math.round(score / qs.length * 100), nota = Math.round(score / qs.length * 20 * 10) / 10;
      if (o.key) { S.best[o.key] = Math.max(S.best[o.key] || 0, pct); }
      save();
      var misses = qs.filter(function (q, n) { return answers[n] !== 0; });
      var verdict = pct >= 85 ? "Listo para esta parte del parcial." : pct >= 65 ? "Vas bien; repasa lo fallado." : "Vuelve a leer los temas y repite.";
      el.innerHTML = '<div class="q-card"><div class="score-big">' + pct + '<small>% · ' + score + "/" + qs.length + " · " + String(nota).replace(".", ",") + "/20</small></div><p class=\"lead\">" + verdict + "</p>" +
        '<div class="row" style="margin-top:1.2rem"><button class="btn primary" id="again">Repetir</button>' + (misses.length ? '<button class="btn" id="retry">Repetir solo falladas (' + misses.length + ")</button>" : "") + "</div></div>" +
        (misses.length ? '<div class="miss"><h2>Para repasar</h2>' + misses.map(function (q) {
          var given = answers[qs.indexOf(q)];
          return '<div class="miss-item"><b>' + esc(q.q) + "</b>" + fig(q.fig) + (given != null ? '<p class="no">Tu respuesta: ' + esc(q.opts[given]) + "</p>" : '<p class="no">Sin responder</p>') + '<p class="ok">Correcta: ' + esc(q.opts[0]) + "</p><p>" + esc(q.why) + "</p></div>";
        }).join("") + "</div>" : "");
      $("#again").onclick = function () { runQuiz(el, shuffle(qs).map(prep), o); };
      if ($("#retry")) $("#retry").onclick = function () { runQuiz(el, shuffle(misses).map(prep), o); };
    }
    show();
  }

  /* ================= SIMULACRO ================= */
  function simulacro(box) {
    var best = S.best.sim;
    box.innerHTML = '<h1>Simulacro</h1><p class="lead">30 preguntas de todos los temas, 45 minutos, sin pistas. Se corrige al final y te da la nota sobre 20. Después haz en papel dos ejercicios de desarrollo para completar el examen.</p>' +
      (best != null ? '<p class="pill" style="margin-top:1rem">Tu mejor resultado: ' + best + "%</p>" : "") +
      '<div class="row" style="margin-top:1.4rem" id="sr"><button class="btn primary" id="go">Comenzar simulacro</button><a class="btn" href="#ejercicios">Ver ejercicios de desarrollo</a></div><div id="qa"></div>';
    $("#go").onclick = function () {
      $("#sr").hidden = true;
      var per = {}, all = shuffle(pool("all")), sel = [];
      all.forEach(function (q) { var k = q.mod; per[k] = (per[k] || 0) + 1; if (per[k] <= 4) sel.push(q); });
      sel = shuffle(sel).slice(0, 30);
      runQuiz($("#qa"), sel.map(prep), { feedback: false, seconds: 45 * 60, key: "sim" });
    };
  }

  /* ================= LABORATORIO ================= */
  var LABS = [["lector", "Lector (min,max)"], ["clasif", "Inherente / implícita / explícita"], ["lpo", "Arma la fórmula"], ["tablas", "¿Qué ocurre?"], ["pares", "Emparejar"]];
  function lab(box, args) {
    var tab = args[0] && LABS.some(function (l) { return l[0] === args[0]; }) ? args[0] : "lector";
    box.innerHTML = '<h1>Laboratorio</h1><p class="lead">Juegos cortos para las partes prácticas del parcial. Cada acierto suma XP.</p><div class="tabs" role="tablist">' +
      LABS.map(function (l) { return '<button class="tab" role="tab" data-t="' + l[0] + '" aria-selected="' + (l[0] === tab) + '">' + l[1] + "</button>"; }).join("") + '</div><div class="lab-body" id="lb"></div>';
    $$(".tab").forEach(function (b) { b.onclick = function () { setHash("lab-" + b.dataset.t); lab(box, [b.dataset.t]); }; });
    ({ lector: labLector, clasif: labClas, lpo: labOrden, tablas: labTablas, pares: labPares }[tab])($("#lb"));
  }

  var CARD_TXT = { "(0,1)": "a lo sumo una vez (puede no participar)", "(1,1)": "exactamente una vez", "(0,N)": "cero o muchas veces", "(1,N)": "al menos una vez" };
  function labLector(lb) {
    var CS = Object.keys(CARD_TXT), good = 0, n = 0;
    function sentence(a, ca, b, cb) { return "Cada " + a + " participa " + CARD_TXT[ca] + "; cada " + b + " participa " + CARD_TXT[cb] + "."; }
    function ratio(ca, cb) { var ma = ca.slice(-2, -1), mb = cb.slice(-2, -1); if (ma === "1" && mb === "1") return "1:1"; if (ma === "N" && mb === "N") return "M:N"; return "1:N"; }
    function round() {
      var p = pick(window.LECTOR_PAIRS), ca = pick(CS), cb = pick(CS), right = sentence(p[0], ca, p[2], cb), opts = [right];
      if (ca !== cb) opts.push(sentence(p[0], cb, p[2], ca));
      var guard = 0;
      while (opts.length < 4 && guard++ < 50) { var s = sentence(p[0], pick(CS), p[2], pick(CS)); if (opts.indexOf(s) < 0) opts.push(s); }
      var order = shuffle(opts.map(function (_, i) { return i; }));
      var fk = ca.slice(-2, -1) === "1" && cb.slice(-2, -1) === "N" ? p[0] : cb.slice(-2, -1) === "1" && ca.slice(-2, -1) === "N" ? p[2] : null;
      var r = ratio(ca, cb);
      var note = "En notación clásica es <b>" + r + "</b>. " + (r === "M:N" ? "Al traducir se crea una relación nueva." : r === "1:N" ? "Al traducir, la FK va en <b>" + esc(fk) + "</b>" + ((fk === p[0] ? ca : cb)[1] === "1" ? " y es NOT NULL." : " y admite NULL.") : "Al traducir, la FK va en cualquiera de los dos (mejor en el de participación total).");
      lb.innerHTML = '<p class="hint" style="text-align:left">Ronda ' + (n + 1) + " · aciertos " + good + " · ¿qué afirma el diagrama?</p>" +
        fig({ t: "bin", a: p[0], ca: ca, r: p[1], cb: cb, b: p[2] }) + '<div class="opts">' + order.map(function (oi, k) {
          return '<button class="opt" data-k="' + oi + '"><span class="l">' + "ABCD"[k] + "</span><span>" + esc(opts[oi]) + "</span></button>";
        }).join("") + '</div><div id="vd"></div>';
      $$(".opt").forEach(function (b) {
        b.onclick = function () {
          var k = +b.dataset.k, ok = k === 0; n++;
          $$(".opt").forEach(function (x) { var v = +x.dataset.k; x.disabled = true; if (v === 0) x.classList.add("right"); else if (v === k) x.classList.add("wrong"); });
          if (ok) { good++; addXp(5); }
          $("#vd").innerHTML = '<div class="verdict ' + (ok ? "good" : "bad") + '">' + (ok ? "¡Correcto! " : "El par se lee junto a su propia entidad. ") + note + ' <button class="btn mini" id="nx">Otra ronda</button></div>';
          $("#nx").onclick = round; $("#nx").focus();
        };
      });
    }
    round();
  }

  function labClas(lb) {
    var q = shuffle(window.CLASSIFY), i = 0, good = 0, labels = { inh: "Inherente", imp: "Implícita", exp: "Explícita" },
      why = { inh: "La impone el propio modelo de datos.", imp: "Se expresa con las estructuras del esquema (el diagrama).", exp: "El diagrama no puede expresarla: va en lenguaje natural y LPO." };
    function draw(fb) {
      if (i >= q.length) { lb.innerHTML = '<div class="q-card"><div class="score-big">' + good + "<small>/" + q.length + '</small></div><p class="lead">Aciertos clasificando restricciones.</p><div class="row" style="margin-top:1rem"><button class="btn primary" id="rp">Jugar de nuevo</button></div></div>'; $("#rp").onclick = function () { labClas(lb); }; return; }
      lb.innerHTML = '<p class="hint" style="text-align:left;margin-bottom:.7rem">' + (i + 1) + " / " + q.length + " · ¿Qué tipo de restricción es?</p>" +
        '<div class="cl-item">' + esc(q[i][0]) + '</div><div class="cl-btns">' + Object.keys(labels).map(function (k) { return '<button class="btn" data-k="' + k + '">' + labels[k] + "</button>"; }).join("") + "</div>" +
        (fb ? '<div class="verdict ' + (fb.ok ? "good" : "bad") + '">' + (fb.ok ? "¡Correcto! " : "Era " + labels[q[i][1]] + ". ") + why[q[i][1]] + ' <button class="btn mini" id="nx">Siguiente</button></div>' : "");
      if (fb) { $$(".cl-btns .btn").forEach(function (b) { b.disabled = true; }); $("#nx").onclick = function () { i++; draw(); }; $("#nx").focus(); return; }
      $$(".cl-btns .btn").forEach(function (b) { b.onclick = function () { var ok = b.dataset.k === q[i][1]; if (ok) { good++; addXp(5); } draw({ ok: ok }); }; });
    }
    draw();
  }

  function labOrden(lb) {
    var seqs = window.LPO_BUILD, cur = seqs[0], ans = [], bag = [];
    function reset(s) { cur = s; ans = []; bag = shuffle(cur.items); draw(); }
    function draw(result) {
      lb.innerHTML = '<label class="field" for="ss" style="max-width:380px">Restricción<select id="ss">' + seqs.map(function (s) { return '<option value="' + s.id + '"' + (s.id === cur.id ? " selected" : "") + ">" + esc(s.name) + "</option>"; }).join("") + "</select></label>" +
        '<div class="mission-q" style="margin-top:1rem"><p><b>En lenguaje natural:</b> ' + esc(cur.nl) + '</p></div>' +
        '<div class="term formula">' + (ans.length ? ans.map(function (a) { return esc(a); }).join(" ") : '<span class="faint">Toca las piezas en orden…</span>') + ' <span class="cur"></span></div>' +
        '<ol class="seq-ans">' + cur.items.map(function (_, i) { var cls = ans[i] ? "filled" : ""; if (result) cls += ans[i] === cur.items[i] ? " ok" : " ko"; return '<li class="' + cls + '" data-i="' + i + '">' + (ans[i] ? esc(ans[i]) : "") + "</li>"; }).join("") + "</ol>" +
        '<div class="chips seq-pool">' + bag.map(function (p, j) { return '<button class="chip mono" data-j="' + j + '">' + esc(p) + "</button>"; }).join("") + "</div>" +
        '<div class="row" style="margin-top:1rem"><button class="btn primary" id="ck"' + (ans.length < cur.items.length ? " disabled" : "") + '>Comprobar</button><button class="btn" id="rs">Reiniciar</button></div>' +
        (result === "ok" ? '<div class="verdict good">¡Fórmula correcta! <code>' + esc(cur.items.join(" ")) + "</code></div>" : result ? '<div class="verdict bad">Hay piezas fuera de lugar (en rojo). Recuerda: cuantificador | rango : cuerpo.</div>' : "");
      $("#ss").onchange = function (e) { reset(seqs.filter(function (s) { return s.id === e.target.value; })[0]); };
      $$(".seq-pool .chip").forEach(function (b) { b.onclick = function () { var j = +b.dataset.j; ans.push(bag[j]); bag.splice(j, 1); draw(); }; });
      $$(".seq-ans li.filled").forEach(function (li) { li.onclick = function () { var i = +li.dataset.i, removed = ans.splice(i); bag = bag.concat(removed); draw(); }; });
      $("#rs").onclick = function () { reset(cur); };
      $("#ck").onclick = function () { var ok = ans.every(function (a, i) { return a === cur.items[i]; }); if (ok) addXp(15); draw(ok ? "ok" : "ko"); };
    }
    reset(cur);
  }

  function labTablas(lb) {
    var sc = window.SCENARIOS, cur = sc[0], done = {}, good = 0, OUT = window.OUTCOMES;
    function draw() {
      lb.innerHTML = '<div class="chips">' + sc.map(function (s) { return '<button class="chip" aria-pressed="' + (s.id === cur.id) + '" data-s="' + s.id + '">' + esc(s.name) + "</button>"; }).join("") + "</div>" +
        '<p class="hint" style="text-align:left;margin:.9rem 0 .4rem">Cada operación parte del <b>estado inicial</b> mostrado. Elige qué ocurre.</p>' +
        '<details class="ddl-box" open><summary>Definición de las tablas</summary><pre class="ddl">' + esc(cur.ddl) + "</pre></details>" +
        fig({ t: "tbl", tables: cur.tables }) +
        '<div class="ops">' + cur.ops.map(function (op, i) {
          var d = done[cur.id + i];
          return '<div class="op' + (d ? (d.ok ? " good" : " bad") : "") + '"><code class="sql">' + esc(op[0]) + '</code>' +
            (d ? '<p class="op-res">' + (d.ok ? "✓ " : "✗ Elegiste: " + esc(OUT[d.k]) + ". Correcto: ") + "<b>" + esc(OUT[op[1]]) + "</b>. " + esc(op[2]) + "</p>"
              : '<label class="sr" for="o' + i + '">Resultado</label><select id="o' + i + '" data-i="' + i + '"><option value="">¿Qué ocurre?</option>' + Object.keys(OUT).map(function (k) { return '<option value="' + k + '">' + esc(OUT[k]) + "</option>"; }).join("") + "</select>") + "</div>";
        }).join("") + "</div>" +
        '<div class="row" style="margin-top:1rem"><span class="pill">Aciertos: ' + good + "</span><button class=\"btn\" id=\"rs\">Reiniciar este escenario</button></div>";
      $$(".chip[data-s]").forEach(function (b) { b.onclick = function () { cur = sc.filter(function (s) { return s.id === b.dataset.s; })[0]; draw(); }; });
      $$(".ops select").forEach(function (s) {
        s.onchange = function () {
          var i = +s.dataset.i, k = s.value; if (!k) return;
          var ok = k === cur.ops[i][1]; done[cur.id + i] = { ok: ok, k: k }; if (ok) { good++; addXp(5); }
          var y = window.scrollY; draw(); window.scrollTo(0, y);
        };
      });
      $("#rs").onclick = function () { cur.ops.forEach(function (_, i) { delete done[cur.id + i]; }); draw(); };
    }
    draw();
  }

  function labPares(lb, setKey) {
    var keys = Object.keys(window.PAIRSETS), k = setKey || keys[0], P = window.PAIRSETS[k];
    var set = shuffle(P.pairs).slice(0, 6), left = null, right = null, done = {}, order = shuffle(set.map(function (_, i) { return i; }));
    function draw() {
      lb.innerHTML = '<div class="chips">' + keys.map(function (x) { return '<button class="chip" aria-pressed="' + (x === k) + '" data-p="' + x + '">' + esc(window.PAIRSETS[x].name) + "</button>"; }).join("") + "</div>" +
        '<p class="hint" style="text-align:left;margin:.9rem 0 .8rem">Elige un término y luego su pareja.</p><div class="pairs"><div class="pairs-col">' +
        set.map(function (p, i) { return '<button class="pair-btn' + (done[i] ? " done" : "") + (left === i ? " sel" : "") + '" data-l="' + i + '">' + esc(p[0]) + "</button>"; }).join("") + '</div><div class="pairs-col">' +
        order.map(function (i) { return '<button class="pair-btn' + (done[i] ? " done" : "") + (right === i ? " sel" : "") + '" data-r="' + i + '">' + esc(set[i][1]) + "</button>"; }).join("") + "</div></div>" +
        (Object.keys(done).length === set.length ? '<div class="verdict good">¡Todo emparejado! <button class="btn mini" id="rp">Otra ronda</button></div>' : "");
      $$("[data-p]").forEach(function (b) { b.onclick = function () { labPares(lb, b.dataset.p); }; });
      $$("[data-l]").forEach(function (b) { b.onclick = function () { left = +b.dataset.l; tryPair(); }; });
      $$("[data-r]").forEach(function (b) { b.onclick = function () { right = +b.dataset.r; tryPair(); }; });
      if ($("#rp")) $("#rp").onclick = function () { labPares(lb, k); };
    }
    function tryPair() {
      if (left == null || right == null) return draw();
      if (left === right) { done[left] = 1; addXp(5); left = right = null; draw(); }
      else { var l = left, r = right; left = right = null; draw(); [$("[data-l='" + l + "']"), $("[data-r='" + r + "']")].forEach(function (x) { x.classList.add("bad"); setTimeout(function () { x.classList.remove("bad"); }, 450); }); }
    }
    draw();
  }

  /* ================= EJERCICIOS ================= */
  function ejercicios(box) {
    var E = window.EJERCICIOS;
    box.innerHTML = '<h1>Ejercicios de desarrollo</h1><p class="lead">Con el formato del parcial. Resuélvelos en papel, con lápiz y cronómetro, y luego abre la solución para corregirte.</p>' +
      '<div class="ej-list">' + E.map(function (e) {
        var st = S.ej[e.id];
        return '<article class="ej" id="ej-' + e.id + '"><p class="eyebrow">' + esc(e.part) + '</p><h3>' + esc(e.title) + (st ? ' <span class="pill ' + (st === "ok" ? "p-ok" : "p-rep") + '">' + (st === "ok" ? "Me salió" : "Repasar") + "</span>" : "") + "</h3>" +
          '<p class="body">' + esc(e.prompt) + "</p>" + fig(e.fig) +
          '<details class="sol"><summary>Ver solución</summary><div class="sol-in">' + e.sol + '</div><div class="row" style="margin-top:.9rem"><button class="btn mini" data-ok="' + e.id + '">Me salió</button><button class="btn mini danger" data-rep="' + e.id + '">Repasar</button></div></details></article>';
      }).join("") + "</div>";
    $$("[data-ok]").forEach(function (b) { b.onclick = function () { if (S.ej[b.dataset.ok] !== "ok") S.xp += 20; S.ej[b.dataset.ok] = "ok"; save(); var y = window.scrollY; ejercicios(box); window.scrollTo(0, y); }; });
    $$("[data-rep]").forEach(function (b) { b.onclick = function () { S.ej[b.dataset.rep] = "rep"; save(); var y = window.scrollY; ejercicios(box); window.scrollTo(0, y); }; });
  }

  /* ================= CHULETA ================= */
  function chuleta(box) {
    box.innerHTML = '<h1>Chuleta</h1><p class="lead">Lo que más cae, en tablas. Para el repaso del domingo en la noche.</p>' +
      '<div class="toolbar" style="margin-top:1.2rem"><input type="search" id="cq" placeholder="Filtrar tablas…" aria-label="Filtrar"></div><div id="ct"></div>';
    function draw(q) {
      var out = "", ql = (q || "").toLowerCase();
      window.CHEATS.forEach(function (t) {
        var text = (t.title + " " + t.head.join(" ") + " " + t.rows.map(function (r) { return r.join(" "); }).join(" ")).toLowerCase();
        if (ql && text.indexOf(ql) < 0) return;
        out += '<section class="cheat"><h2>' + esc(t.title) + '</h2><div class="tbl-wrap"><table><thead><tr>' + t.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          t.rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div></section>";
      });
      $("#ct").innerHTML = out || '<div class="empty" style="margin-top:1rem">Sin resultados.</div>';
    }
    $("#cq").oninput = function (e) { draw(e.target.value.trim()); };
    draw();
  }

  /* ---------- Arranque ---------- */
  $$("#nav a").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); go(a.dataset.r); }); });
  renderXp(); setInterval(tick, 30000);
  route();
})();

</script>
</body></html>
